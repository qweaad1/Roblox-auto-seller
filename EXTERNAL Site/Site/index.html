        // ============================================================
        // КАТАЛОГ
        // ============================================================
        async function loadCatalog() {
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            document.querySelector('.nav-links a:first-child').classList.add('active');

            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = `<div class="loading-shimmer"><i class="fas fa-spinner"></i> Загрузка...</div>`;

            try {
                const result = await apiRequest('GET', '/api/inventory');
                
                if (result?.success || result?.Success) {
                    state.catalog = result.data || result.Data || [];
                    renderCatalog();
                } else {
                    grid.innerHTML = `<div class="no-items"><i class="fas fa-exclamation-triangle"></i> Ошибка</div>`;
                    showToast('Ошибка загрузки', 'error');
                }
            } catch (e) {
                grid.innerHTML = `<div class="no-items"><i class="fas fa-exclamation-triangle"></i> Ошибка</div>`;
                showToast('Ошибка загрузки', 'error');
            }
        }

        function renderCatalog(filter = '') {
            const grid = document.getElementById('catalogGrid');
            let items = state.catalog || [];

            if (filter.trim()) {
                const s = filter.toLowerCase().trim();
                items = items.filter(i =>
                    (i.clean_name_en || '').toLowerCase().includes(s) ||
                    (i.raw_name || '').toLowerCase().includes(s)
                );
            }

            items.sort((a, b) => {
                if ((a.FIRE || 0) !== (b.FIRE || 0)) return (b.FIRE || 0) - (a.FIRE || 0);
                return (a.clean_name_en || '').localeCompare(b.clean_name_en || '');
            });

            document.getElementById('itemCount').textContent = `${items.length} товаров`;

            if (!items.length) {
                grid.innerHTML = `<div class="no-items"><i class="fas fa-box-open"></i> Товаров нет</div>`;
                return;
            }

            let html = '';
            items.forEach((item) => {
                const raw = item.raw_name;
                const count = item.count || 0;
                const price = parseFloat(item.price) || 0;
                const spprice = item.SPPRICE != null ? parseFloat(item.SPPRICE) : 0;
                const displayPrice = (spprice > 0 && spprice < price) ? spprice : price;
                const isFire = (item.FIRE || 0) > 0;
                const hasDiscount = spprice > 0 && spprice < price;

                let discountPercent = 0;
                if (hasDiscount && price > 0) {
                    discountPercent = Math.round((1 - spprice / price) * 100);
                }

                let cardClasses = 'item-card';
                if (isFire) cardClasses += ' fire';
                if (hasDiscount) cardClasses += ' has-discount';

                html += `
                    <div class="${cardClasses}">
                        ${hasDiscount ? `<div class="discount-badge-top">-${discountPercent}%</div>` : (isFire ? '<div class="fire-badge">🔥</div>' : '')}
                        <img class="item-image" src="images/${raw}.png" 
                             alt="${item.clean_name_en || raw}"
                             onerror="this.src='images/placeholder.png'">
                        <div class="item-name">${item.clean_name_en || raw}</div>
                        <div class="item-details">
                            <div class="item-count">${count} шт.</div>
                            <div class="item-price-row">
                                ${hasDiscount ? `<span class="item-spprice">${price.toFixed(2)} ₽</span>` : ''}
                                <span class="item-price">${displayPrice.toFixed(2)} ₽</span>
                              
                            </div>
                        </div>
                        <button class="add-to-cart-btn" onclick="addToCart('${raw}')" ${count <= 0 ? 'disabled' : ''}>
                            <i class="fas fa-cart-plus"></i> ${count > 0 ? 'В корзину' : 'Нет'}
                        </button>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        // ============================================================
        // ПОИСК
        // ============================================================
        function handleSearch(value) {
            const query = value.trim();
            if (query.length > 0) {
                window.location.href = `orders.html?username=${encodeURIComponent(query)}`;
            } else {
                showToast('Введите ник', 'warning');
            }
        }

        // ============================================================
        // КОРЗИНА
        // ============================================================
        function loadCart() {
            try {
                state.cart = JSON.parse(localStorage.getItem('market_cart')) || [];
            } catch {
                state.cart = [];
            }
            renderCart();
        }

        function saveCart() {
            localStorage.setItem('market_cart', JSON.stringify(state.cart));
            renderCart();
        }

        function addToCart(rawName) {
            const item = state.catalog.find(i => i.raw_name === rawName);
            if (!item) { showToast('Товар не найден', 'error'); return; }

            const available = item.count || 0;
            if (available <= 0) { showToast('Нет в наличии', 'warning'); return; }

            const existing = state.cart.find(i => i.raw_name === rawName);
            const currentQty = existing ? existing.quantity : 0;
            if (currentQty >= available) { showToast('Лимит', 'warning'); return; }

            if (existing) {
                existing.quantity += 1;
            } else {
                state.cart.push({
                    raw_name: item.raw_name,
                    clean_name_en: item.clean_name_en || item.raw_name,
                    fire: item.FIRE || 0,
                    quantity: 1
                });
            }
            saveCart();
            showToast(`${item.clean_name_en || item.raw_name} добавлен`, 'success');
            document.getElementById('cartPanel').classList.add('open');
            isCartOpen = true;
            
            if (typeof ym !== 'undefined') {
                ym(112325513, 'reachGoal', 'cartADD');
            }
            
            updateCartPrices();
        }

        function removeFromCart(index) {
            state.cart.splice(index, 1);
            saveCart();
            updateCartPrices();
        }

        function updateQuantity(index, delta) {
            const item = state.cart[index];
            if (!item) return;

            const priceInfo = state.cartPrices[item.raw_name];
            const available = priceInfo?.allowed || state.catalog.find(i => i.raw_name === item.raw_name)?.count || 0;
            const newQty = item.quantity + delta;

            if (newQty < 1) { removeFromCart(index); return; }
            if (newQty > available) { showToast(`Доступно: ${available}`, 'warning'); return; }

            item.quantity = newQty;
            saveCart();
            updateCartPrices();
        }

        function addMaxQuantity(index) {
            const item = state.cart[index];
            if (!item) return;
            const available = state.cartPrices[item.raw_name]?.allowed || state.catalog.find(i => i.raw_name === item.raw_name)
                ?.count || 0;
            if (item.quantity >= available) { showToast('Максимум', 'warning'); return; }
            item.quantity = available;
            saveCart();
            updateCartPrices();
        }

        function clearCart() {
            if (!state.cart.length) return;
            if (confirm('Очистить корзину?')) {
                state.cart = [];
                saveCart();
                showToast('Корзина очищена', 'info');
                updateCartPrices();
            }
        }

        // ============================================================
        // ОБНОВЛЕНИЕ ЦЕН КОРЗИНЫ
        // ============================================================
        async function updateCartPrices() {
            if (!state.cart.length) {
                state.cartPrices = {};
                renderCart();
                return;
            }

            try {
                const cartData = state.cart.map(item => ({ 
                    raw_name: item.raw_name, 
                    count: item.quantity 
                }));
                
                const result = await apiRequest('POST', `/api/payments/cart?finish=false`, {
                    username: 'temp',
                    locator: 'service_1',
                    email: 'temp@temp.com',
                    payment_method: 'sbp',
                    data: cartData
                });

                if (result?.status === 'ok' || result?.Status === 'ok' || result?.success) {
                    let items = result.Items || result.items || result.data || result.Data || [];
                    if (Array.isArray(items) && items.length > 0) {
                        const prices = {};
                        items.forEach(i => {
                            const key = i.itemName || i.item_name || i.raw_name;
                            if (key) {
                                prices[key] = {
                                    price: i.unitPrice || i.unitprice || 0,
                                    total: i.paySum || i.paysum || 0,
                                    allowed: i.allowed || i.Allowed || 0,
                                    wanted: i.wanted || 0
                                };
                            }
                        });
                        state.cartPrices = prices;
                        
                        const totalSBP = result.payAmountSBP || result.PayAmountSBP || 0;
                        const totalCARD = result.payAmountCARD || result.PayAmountCARD || 0;
                        state.checkoutData = {
                            payAmountSBP: totalSBP,
                            payAmountCARD: totalCARD,
                            cardFee: result.cardFee || result.CardFee || '0%'
                        };
                    }
                }
            } catch (e) {
                console.error('CART PRICES ERROR:', e);
                fallbackPrices();
            }
            renderCart();
        }

        // ============================================================
        // ПРОВЕРКА КОРЗИНЫ
        // ============================================================
        async function validateCart() {
            if (!state.cart.length) {
                showToast('Корзина пуста', 'warning');
                return null;
            }

            try {
                const cartData = state.cart.map(item => ({ 
                    raw_name: item.raw_name, 
                    count: item.quantity 
                }));
                
                const result = await apiRequest('POST', `/api/payments/cart?finish=true`, {
                    username: 'temp',
                    locator: 'service_1',
                    email: 'temp@temp.com',
                    payment_method: 'sbp',
                    data: cartData
                });

                if (result?.status === 'ok' || result?.Status === 'ok' || result?.success) {
                    const items = result.Items || result.items || result.data || result.Data || [];
                    let allValid = true;
                    
                    if (Array.isArray(items)) {
                        items.forEach(item => {
                            const wanted = item.wanted || 0;
                            const allowed = item.allowed || item.Allowed || 0;
                            if (wanted > allowed) {
                                allValid = false;
                                showToast(`❌ ${item.itemName || item.raw_name}: доступно ${allowed}`, 'error');
                            }
                        });
                    }
                    
                    if (!allValid) return null;
                    
                    state.checkoutData = {
                        payAmountSBP: result.payAmountSBP || result.PayAmountSBP || 0,
                        payAmountCARD: result.payAmountCARD || result.PayAmountCARD || 0,
                        cardFee: result.cardFee || result.CardFee || '0%'
                    };
                    
                    if (Array.isArray(items) && items.length > 0) {
                        let compHtml = '';
                        items.forEach(item => {
                            const name = item.itemName || item.item_name || item.raw_name || 'Товар';
                            const paySum = parseFloat(item.paySum || item.PaySum || 0);
                            const count = parseInt(item.wanted || item.count || 1);
                            const total = paySum;
                            compHtml += `
                                <div class="comp-item">
                                    <img src="images/${name}.png" alt="${name}" onerror="this.src='images/placeholder.png'">
                                    <div class="comp-info">
                                        <span class="comp-name">${name}</span>
                                        <span class="comp-qty">×${count}</span>
                                        <span class="comp-price">${total.toFixed(2)} ₽</span>
                                    </div>
                                </div>
                            `;
                        });
                        document.getElementById('orderCompositionItems').innerHTML = compHtml;
                    }
                    
                    updatePaymentButtons();
                    return result;
                } else {
                    showToast('Ошибка проверки', 'error');
                    return null;
                }
            } catch (e) {
                showToast('Ошибка проверки', 'error');
                return null;
            }
        }

        // ============================================================
        // ОПЛАТА
        // ============================================================
        async function submitCheckout(method) {
            if (!isBotActive()) { showToast('❌ Бот неактивен', 'error'); return; }
            if (!serverConfirmed) { showToast('Подтвердите доступ к серверу', 'warning'); return; }
            
            const username = document.getElementById('usernameInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            
            if (!username) { showToast('Введите ник для обмена', 'warning'); return; }
            if (!email) { showToast('Введите email', 'warning'); return; }
            if (!email.includes('@') || !email.includes('.')) { showToast('Введите корректный email', 'warning'); return; }
            
            const sbp = state.checkoutData?.payAmountSBP || state.checkoutData?.payAmountSbp || getCartTotal();
            if (sbp < 1.00) {
                showToast('❌ Мин. сумма: 1 ₽', 'warning');
                return;
            }

            const errorEl = document.getElementById('checkoutError');
            errorEl.style.display = 'none';

            document.getElementById('checkoutLoading').classList.add('active');

            if (typeof ym !== 'undefined') {
                if (method === 'sbp') {
                    ym(112325513, 'reachGoal', 'paySBP');
                } else if (method === 'card') {
                    ym(112325513, 'reachGoal', 'payCARD');
                }
                ym(112325513, 'reachGoal', 'pay');
            }

            try {
                const result = await createOrder(method, username, email);
                
                document.getElementById('checkoutLoading').classList.remove('active');

                if (result?.Pay) {
                    const payUrl = result.Pay;
                    
                    state.cart = [];
                    saveCart();
                    closeCheckout();
                    
                    window.open(payUrl, '_blank');
                    showToast('✅ Заказ создан!', 'success');
                    await loadCatalog();
                } else if (result?.status === 'ok' || result?.Status === 'ok' || result?.success) {
                    const payUrl = result.pay || result.paymentUrl || result.PaymentUrl || result.url || result.Url;
                    if (payUrl) {
                        state.cart = [];
                        saveCart();
                        closeCheckout();
                        window.open(payUrl, '_blank');
                        showToast('✅ Заказ создан!', 'success');
                        await loadCatalog();
                    } else {
                        errorEl.textContent = '✅ Заказ создан! Ссылка в Telegram.';
                        errorEl.style.display = 'block';
                        errorEl.style.color = '#5a8a72';
                        
                        state.cart = [];
                        saveCart();
                        setTimeout(() => {
                            closeCheckout();
                            loadCatalog();
                        }, 3000);
                    }
                } else {
                    let errorMsg = result?.message || result?.Message || result?.Error || result?.error || 'Ошибка';
                    errorEl.textContent = `❌ ${errorMsg}`;
                    errorEl.style.display = 'block';
                    errorEl.style.color = '#c27a7a';
                }
            } catch (e) {
                console.error('SUBMIT CHECKOUT ERROR:', e);
                document.getElementById('checkoutLoading').classList.remove('active');
                errorEl.textContent = `❌ Ошибка: ${e.message || 'Неизвестная'}`;
                errorEl.style.display = 'block';
                errorEl.style.color = '#c27a7a';
            }
        }

        // ============================================================
        // СОЗДАНИЕ ЗАКАЗА
        // ============================================================
        async function createOrder(method, username, email) {
            if (!serverConfirmed) {
                showToast('Подтвердите доступ', 'warning');
                return null;
            }
            
            if (!state.cart.length) {
                showToast('Корзина пуста', 'warning');
                return null;
            }

            try {
                const cartData = state.cart.map(item => ({ 
                    raw_name: item.raw_name, 
                    count: item.quantity 
                }));
                
                const result = await apiRequest('POST', `/api/Payments`, {
                    username: username || 'temp',
                    locator: 'service_1',
                    email: email || 'temp@temp.com',
                    payment_method: method === 'sbp' ? 'sbp' : 'card',
                    data: cartData
                });

                return result;
            } catch (e) {
                console.error('CREATE ORDER ERROR:', e);
                return null;
            }
        }

        function fallbackPrices() {
            state.cartPrices = {};
            state.cart.forEach(item => {
                const catalogItem = state.catalog.find(i => i.raw_name === item.raw_name);
                if (catalogItem) {
                    const price = catalogItem.price || 0;
                    const spprice = catalogItem.SPPRICE || 0;
                    const displayPrice = (spprice > 0 && spprice < price) ? spprice : price;
                    state.cartPrices[item.raw_name] = {
                        price: displayPrice,
                        total: displayPrice * item.quantity,
                        allowed: catalogItem.count || 0
                    };
                }
            });
        }

        function getCartTotal() {
            let total = 0;
            state.cart.forEach(item => {
                const info = state.cartPrices[item.raw_name];
                if (info) total += info.price * item.quantity;
                else {
                    const cat = state.catalog.find(i => i.raw_name === item.raw_name);
                    if (cat) {
                        const price = cat.price || 0;
                        const spprice = cat.SPPRICE || 0;
                        total += ((spprice > 0 && spprice < price) ? spprice : price) * item.quantity;
                    }
                }
            });
            return total;
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            const badge = document.getElementById('cartBadge');
            const totalItems = state.cart.reduce((s, i) => s + i.quantity, 0);

            if (!state.cart.length) {
                container.innerHTML = `<div class="empty-cart"><i class="fas fa-shopping-basket"></i> Корзина пуста</div>`;
                badge.style.display = 'none';
                return;
            }

            badge.textContent = totalItems;
            badge.style.display = 'flex';

            let html = '';
            state.cart.forEach((item, idx) => {
                const info = state.cartPrices[item.raw_name];
                let price = 0,
                    available = 0;
                if (info) { price = info.price;
                    available = info.allowed || 0; } else {
                    const cat = state.catalog.find(i => i.raw_name === item.raw_name);
                    if (cat) {
                        const p = cat.price || 0,
                            sp = cat.SPPRICE || 0;
                        price = (sp > 0 && sp < p) ? sp : p;
                        available = cat.count || 0;
                    }
                }
                const isFire = (item.fire || 0) > 0;
                const isMax = item.quantity >= available;
                const remaining = available - item.quantity;
                const addLabel = remaining > 0 ? (remaining >= 100 ? '+100' : `+${remaining}`) : '';

                html += `
                    <div class="cart-item ${isFire ? 'fire-item' : ''}">
                        ${isFire ? '<span style="font-size:14px;">🔥</span>' : ''}
                        <img src="images/${item.raw_name}.png" alt="${item.clean_name_en}" onerror="this.src='images/placeholder.png'">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.clean_name_en || item.raw_name}</div>
                            <div class="cart-item-price">${price.toFixed(2)} ₽</div>
                            <div class="cart-item-stock">${available} шт.</div>
                        </div>
                        <div class="cart-item-actions">
                            <button class="qty-btn" onclick="updateQuantity(${idx}, -1)">−</button>
                            <span class="qty-display">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${idx}, 1)" ${isMax ? 'disabled' : ''}>+</button>
                            ${addLabel ? `<button class="qty-btn qty-plus-all" onclick="addMaxQuantity(${idx})">${addLabel}</button>` : ''}
                            <button class="remove-btn" onclick="removeFromCart(${idx})"><i class="fas fa-times"></i></button>
                        </div>
                    </div>
                `;
            });

            const total = getCartTotal();
            const botActive = isBotActive();
            html += `
                <div class="cart-total"><span>Итого</span><span>${total.toFixed(2)} ₽</span></div>
                <button class="cart-checkout-btn" onclick="openCheckout()" ${!botActive ? 'disabled' : ''}>
                    <i class="fas fa-credit-card"></i> ${botActive ? 'Оформить' : 'Бот неактивен'}
                </button>
            `;
            container.innerHTML = html;
        }

        function toggleCart() {
            const panel = document.getElementById('cartPanel');
            panel.classList.toggle('open');
            isCartOpen = panel.classList.contains('open');
            if (isCartOpen) updateCartPrices();
        }

        // ============================================================
        // ОТКРЫТИЕ ОФОРМЛЕНИЯ
        // ============================================================
        async function openCheckout() {
            if (!state.cart.length) { showToast('Корзина пуста', 'warning'); return; }
            if (!isBotActive()) { showToast('❌ Бот неактивен', 'error'); return; }

            // Сбрасываем состояние чекбокса при открытии
            const checkbox = document.getElementById('serverCheckbox');
            checkbox.checked = false;
            serverConfirmed = false;
            document.getElementById('serverCheckBlock').classList.remove('success');
            document.getElementById('serverCheckStatus').className = '';
            document.getElementById('serverCheckStatus').innerHTML = '';

            const validationResult = await validateCart();
            if (!validationResult) {
                showToast('❌ Проверьте наличие', 'error');
                return;
            }

            document.getElementById('checkoutError').style.display = 'none';
            document.getElementById('checkoutLoading').classList.remove('active');
            document.getElementById('checkoutModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function updatePaymentButtons() {
            const sbp = state.checkoutData?.payAmountSBP || state.checkoutData?.payAmountSbp || getCartTotal();
            const card = state.checkoutData?.payAmountCARD || state.checkoutData?.payAmountCard || getCartTotal();
            const fee = state.checkoutData?.cardFee || state.checkoutData?.cardfee || '0%';
            document.getElementById('sbpAmount').textContent = sbp.toFixed(2) + ' ₽';
            document.getElementById('cardAmount').textContent = card.toFixed(2) + ' ₽';
            document.getElementById('cardFee').textContent = `Комиссия: ${fee}`;

            const sbpBtn = document.getElementById('paySbpBtn');
            const cardBtn = document.getElementById('payCardBtn');
            const botActive = isBotActive();
            
            const minAmount = 1.00;
            const isMinAmount = sbp >= minAmount;
            
            const minAmountWarning = document.getElementById('minAmountWarning');
            const currentTotalEl = document.getElementById('currentTotal');
            if (minAmountWarning) {
                if (!isMinAmount) {
                    minAmountWarning.style.display = 'flex';
                    if (currentTotalEl) {
                        currentTotalEl.textContent = sbp.toFixed(2);
                    }
                    sbpBtn.disabled = true;
                    cardBtn.disabled = true;
                } else {
                    minAmountWarning.style.display = 'none';
                }
            }

            if (!serverConfirmed || !botActive || !isMinAmount) {
                sbpBtn.disabled = true;
                cardBtn.disabled = true;
            } else {
                sbpBtn.disabled = false;
                cardBtn.disabled = false;
            }
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.remove('open');
            document.body.style.overflow = '';
        }

        // ============================================================
        // ЗАКАЗЫ
        // ============================================================
        async function loadOrders() {
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            document.querySelector('.nav-links a:last-child').classList.add('active');

            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = `
                <div class="orders-container">
                    <div class="search-card">
                        <h3><i class="fas fa-search"></i> Поиск заказов</h3>
                        <p>Введите имя пользователя</p>
                        <div class="search-box-inline">
                            <input type="text" id="orderSearchInput" placeholder="Username..." 
                                   onkeydown="if(event.key==='Enter') searchOrders()">
                            <button onclick="searchOrders()"><i class="fas fa-search"></i> Найти</button>
                        </div>
                        <div class="order-results" id="orderResults"></div>
                    </div>
                </div>
            `;
        }

        async function searchOrders() {
            const username = document.getElementById('orderSearchInput').value.trim();
            const results = document.getElementById('orderResults');
            if (!username) { results.innerHTML = '<div style="color:#c27a7a;font-size:13px;">Введите имя</div>'; return; }

            results.innerHTML = '<div style="text-align:center;color:#b5a898;font-size:13px;"><i class="fas fa-spinner fa-spin"></i> Поиск...</div>';

            try {
                const result = await apiRequest('GET', `/api/orders/user/${encodeURIComponent(username)}`);
               
                if (result?.success || result?.Success) {
                    const orders = result.data || result.Data || [];
                    if (!orders.length) { results.innerHTML = '<div style="color:#8a7a6a;font-size:13px;">Заказов нет</div>'; return; }

                    const statusMap = {
                        '-999': 'Ожидание оплаты',
                        '-1001': 'Неизвестный',
                        '-1000': 'Отменен',
                        '-1': 'Возврат',
                        '0': 'Выполнен',
                        '1': 'Готов',
                        '2': 'Выполнен'
                    };
                    const colors = {
                        '-999': '#dbb8a0',
                        '-1001': '#c27a7a',
                        '-1000': '#c27a7a',
                        '-1': '#b8957a',
                        '0': '#5a8a72',
                        '1': '#b5a898',
                        '2': '#5a8a72'
                    };

                    let html = '';
                    orders.forEach(o => {
                        const statusCode = String(o.status || '-999');
                        const st = statusMap[statusCode] || `Статус ${statusCode}`;
                        const color = colors[statusCode] || '#8a7a6a';
                        const id = o.id_order_ref_funpay || '';
                        html += `
                            <div class="order-card">
                                <div class="order-header">
                                    <div><span class="order-id">${id}</span> <span style="color:#8a7a6a;font-size:11px;margin-left:4px;">${o.item_name || ''}</span></div>
                                    <span class="order-status" style="color:${color};">${st}</span>
                                </div>
                                <div class="order-details">
                                    <span><i class="fas fa-user"></i> ${o.addressee_player || ''}</span>
                                    <span><i class="fas fa-hashtag"></i> ${o.count_to_send || 0}</span>
                                    <span><i class="fas fa-ruble-sign"></i> ${o.price || 0}</span>
                                </div>
                                <button class="waybill-btn" onclick="viewWaybill('${id}')"><i class="fas fa-truck"></i> Путевой лист</button>
                                <div class="waybill-container" id="waybill_${id.replace(/[^a-zA-Z0-9]/g, '_')}"></div>
                            </div>
                        `;
                    });
                    results.innerHTML = html;
                } else {
                    results.innerHTML = '<div style="color:#c27a7a;font-size:13px;">Заказы не найдены</div>';
                }
            } catch {
                results.innerHTML = '<div style="color:#c27a7a;font-size:13px;">Ошибка поиска</div>';
            }
        }

        async function viewWaybill(orderId) {
            const containerId = `waybill_${orderId.replace(/[^a-zA-Z0-9]/g, '_')}`;
            const container = document.getElementById(containerId);
            if (container.classList.contains('show')) { container.classList.remove('show'); return; }

            container.classList.add('show');
            container.innerHTML = '<div style="color:#b5a898;font-size:12px;"><i class="fas fa-spinner fa-spin"></i> Загрузка...</div>';

            try {
                const result = await apiRequest('GET', `/api/waybill/${encodeURIComponent(orderId)}`);
                if ((result?.success || result?.Success) && (result?.Data || result?.data)?.length) {
                    const data = result.Data || result.data || [];
                    let html = `<div style="background:#faf7f2;border-radius:8px;padding:8px;border:1px solid rgba(200,185,170,0.1);margin-top:4px;">
                                <div style="font-size:11px;color:#b8957a;margin-bottom:4px;">📦 ${data.length} предметов</div>`;
                    data.forEach(item => {
                        const done = item.Done || item.done ? '✅' : '⏳';
                        html += `<div class="waybill-item"><span>${done} ${item.item_catalog_name || ''}</span><span>${item.sender || ''}→${item.addressee || ''}</span></div>`;
                    });
                    html += `</div>`;
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<div style="color:#8a7a6a;font-size:12px;">Путевой лист пуст</div>';
                }
            } catch {
                container.innerHTML = '<div style="color:#c27a7a;font-size:12px;">Ошибка</div>';
            }
        }

        // ============================================================
        // ТОСТЫ
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                toast.style.transition = 'all 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                loadCart();
                await checkBotStatus();
                await loadCatalog();

                setInterval(async () => {
                    await checkBotStatus();
                    if (state.cart.length) updateCartPrices();
                }, 30000);

                document.addEventListener('keydown', e => {
                    if (e.key === 'Escape') {
                        closeCheckout();
                        const panel = document.getElementById('cartPanel');
                        if (panel.classList.contains('open')) { panel.classList.remove('open');
                            isCartOpen = false; }
                    }
                });

                document.getElementById('checkoutModal').addEventListener('click', function(e) {
                    if (e.target === this) closeCheckout();
                });
            } catch (e) {
                console.error('❌ INIT ERROR:', e);
            }
        });
    </script>

</body>
